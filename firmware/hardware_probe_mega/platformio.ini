[env:mega2560_probe]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
  ; Room for a whole USB sample (~800 bytes at 5 Hz) and a whole compact Bluetooth line,
  ; so printing never stalls the 200 ms cycle. Only Serial and Serial3 are linked.
  -DSERIAL_TX_BUFFER_SIZE=1024
