; Stand-alone bench test for the DRV8825/A4988 stepper on the shield's PL header.
; Flashing it replaces the run firmware (EEPROM calibration is kept); reflash hardware_probe_mega after.
[env:mega2560_stepper_test]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
