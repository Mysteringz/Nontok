[platformio]
default_envs = mega2560
src_dir = firmware/core_robot_mega/src
include_dir = firmware/core_robot_mega/include

[env:mega2560]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
build_flags = -Wall -Wextra

[env:mega2560_legacy]
extends = env:mega2560
build_flags = ${env:mega2560.build_flags} -DMOEBIUS_LEGACY_M4_PINS=1

[env:mega2560_oled]
extends = env:mega2560
build_flags = ${env:mega2560.build_flags} -DOLED_DRIVER=3
lib_deps = olikraus/U8g2@2.36.15

[env:mega2560_sh1106]
extends = env:mega2560_oled
build_flags = ${env:mega2560.build_flags} -DOLED_DRIVER=2
